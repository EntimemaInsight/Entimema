[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entimema-ai-runtime"
version = "0.1.0"
description = "Typed cognitive-financial domain foundation for Entimema"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["app", "concierge", "core", "domain", "epistemic", "problem_formation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
