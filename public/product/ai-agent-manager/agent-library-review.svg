<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071b4d" flood-opacity=".12"/></filter><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient></defs><rect width="1100" height="760" rx="28" fill="url(#bg)"/><text x="58" y="70" font-family="Arial" font-size="12" font-weight="700" fill="#ff6b3d">AGENT LIBRARY PREVIEW</text><text x="58" y="118" font-family="Arial" font-size="34" font-weight="700" fill="#071b4d">Exception Review Agent</text><text x="58" y="156" font-family="Arial" font-size="15" fill="#5f6d86">Material ambiguity stays blocked until a finance reviewer records the judgement.</text><rect x="60" y="208" width="980" height="470" rx="22" fill="#fff" stroke="#d9e0ea" filter="url(#s)"/><rect x="60" y="208" width="980" height="58" rx="22" fill="#071b4d"/><rect x="60" y="244" width="980" height="22" fill="#071b4d"/><text x="92" y="244" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Entimema Review Workspace</text><rect x="870" y="222" width="136" height="30" rx="15" fill="#ff6b3d"/><text x="900" y="242" font-family="Arial" font-size="10" font-weight="700" fill="#fff">1 OPEN EXCEPTION</text><rect x="60" y="266" width="190" height="412" fill="#f8fafc"/><g font-family="Arial" font-size="10"><text x="88" y="306" font-weight="700" fill="#071b4d">REVIEW QUEUE</text><rect x="78" y="330" width="154" height="62" rx="10" fill="#fff0e9"/><text x="94" y="352" font-weight="700" fill="#ff6b3d">FI–0024</text><text x="94" y="374" fill="#071b4d">Definition mismatch</text><text x="88" y="430" fill="#75829d">FI–0023</text><text x="88" y="470" fill="#75829d">FI–0022</text><text x="88" y="510" fill="#75829d">FI–0021</text></g><rect x="250" y="266" width="500" height="412" fill="#fff"/><text x="282" y="306" font-family="Arial" font-size="10" font-weight="700" fill="#ff