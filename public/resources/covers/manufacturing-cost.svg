<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Industrial editorial sculpture</title><desc id="d">Machined translucent planes suspended around a precision-cut industrial core.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e9e7e0"/><stop offset=".52" stop-color="#cbd3d3"/><stop offset="1" stop-color="#8296a3"/></linearGradient>
