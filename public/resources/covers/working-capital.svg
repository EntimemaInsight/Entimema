<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Liquidity held in tension</title><desc id="d">A luminous continuous ribbon curves through a midnight field.</desc><defs>
<radialGradient id="bg" cx="72%" cy="47%" r="75%"><stop stop-color="#315d72"/><stop offset=".5" stop-color="#102f50"/><stop offset="1" stop-color="#06162d"/></radialGradient>
